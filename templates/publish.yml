# Copy to .github/workflows/publish.yml in a code repo that homelab deploys.
# One-time enrollment:  op document get "GitHub App homelab-deploy private key" --vault Homelab \
#                         | gh secret set HOMELAB_BUMP_APP_KEY -R fredabood/<repo>
name: Publish

on:
  push:
    branches: [main]
    paths:
      - '<component>/**'            # only what the image contains
      - '.github/workflows/publish.yml'
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}   # never `build` — APK repos use that group
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml   # publish only what CI passed

  deploy:
    needs: test
    uses: fredabood/deploy-actions/.github/workflows/publish-and-bump.yml@v1
    permissions:
      contents: read
      packages: write
    with:
      image-name: <name>                 # -> ghcr.io/fredabood/<name>
      context: <component>
      smoke-command: |
        test "$(docker run --rm --entrypoint id "$IMAGE" -u)" != 0
    secrets:
      HOMELAB_BUMP_APP_KEY: ${{ secrets.HOMELAB_BUMP_APP_KEY }}
