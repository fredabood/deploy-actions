name: Publish image
description: >-
  Build a linux/arm64 image and push it to GHCR as ghcr.io/<owner>/<name>:sha-<commit>,
  then pull it back by digest and (optionally) smoke-test it. Outputs the literal pin
  homelab stores: <image>:sha-<commit>@sha256:<digest>.

inputs:
  image-name:
    description: 'Image name under ghcr.io/<owner>/ (e.g. buzz-notifier).'
    required: true
  context:
    description: 'Docker build context. Never the repo root if the repo holds local data.'
    required: false
    default: '.'
  file:
    description: 'Dockerfile path (default: <context>/Dockerfile).'
    required: false
    default: ''
  platforms:
    description: 'Target platforms. homelab runs on an aarch64 Mac mini.'
    required: false
    default: 'linux/arm64'
  smoke-command:
    description: >-
      Optional shell run after the push with IMAGE set to the pinned reference. Fail it to
      stop the bump (e.g. `test "$(docker run --rm "$IMAGE" id -u)" != 0`).
    required: false
    default: ''
  registry-token:
    description: 'Token with packages:write (the caller workflow needs `permissions: packages: write`).'
    required: false
    default: ${{ github.token }}

outputs:
  image:
    description: 'ghcr.io/<owner>/<name>'
    value: ${{ steps.ref.outputs.image }}
  tag:
    description: 'sha-<commit>'
    value: ${{ steps.ref.outputs.tag }}
  digest:
    description: 'sha256:<digest> of the pushed manifest'
    value: ${{ steps.push.outputs.digest }}
  pin:
    description: '<image>:sha-<commit>@sha256:<digest> — the literal homelab pins'
    value: ${{ steps.pin.outputs.pin }}

runs:
  using: composite
  steps:
    - id: ref
      shell: bash
      env:
        NAME: ${{ inputs.image-name }}
        OWNER: ${{ github.repository_owner }}
        SHA: ${{ github.sha }}
      run: |
        set -euo pipefail
        # GitHub does not enforce `required:` on composite-action inputs.
        [[ "$NAME" =~ ^[a-z0-9][a-z0-9._-]*$ ]] || { echo "::error::deploy-actions/publish-image: invalid image-name '$NAME'"; exit 1; }
        owner="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
        echo "image=ghcr.io/${owner}/${NAME}" >> "$GITHUB_OUTPUT"
        echo "tag=sha-${SHA}" >> "$GITHUB_OUTPUT"

    - uses: docker/setup-buildx-action@v3

    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.registry-token }}

    - id: push
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.file }}
        platforms: ${{ inputs.platforms }}
        push: true
        # ONE immutable tag. No :latest — a deploy that follows a moving tag cannot tell
        # "redeployed" from "unchanged", and homelab pins the digest anyway.
        tags: ${{ steps.ref.outputs.image }}:${{ steps.ref.outputs.tag }}
        labels: |
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
        # A single-platform manifest, not an attestation index: the digest homelab pins is
        # then exactly the manifest the mini pulls, with nothing to resolve (homelab#1846 E8).
        provenance: false
        sbom: false
        cache-from: type=gha,scope=${{ inputs.image-name }}
        cache-to: type=gha,mode=max,scope=${{ inputs.image-name }}

    - id: pin
      shell: bash
      env:
        IMAGE: ${{ steps.ref.outputs.image }}
        TAG: ${{ steps.ref.outputs.tag }}
        DIGEST: ${{ steps.push.outputs.digest }}
      run: |
        set -euo pipefail
        [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::build-push-action returned no digest ('$DIGEST')"; exit 1; }
        pin="${IMAGE}:${TAG}@${DIGEST}"
        echo "pin=$pin" >> "$GITHUB_OUTPUT"
        # Prove the pin resolves: pull exactly what homelab will pull.
        docker pull --quiet "$pin" >/dev/null
        arch="$(docker image inspect "$pin" --format '{{.Architecture}}')"
        case "$arch" in arm64|aarch64) ;; *) echo "::error::published image is $arch, homelab needs arm64"; exit 1 ;; esac
        {
          echo "### Published"
          echo '```'
          echo "$pin"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - if: inputs.smoke-command != ''
      shell: bash
      env:
        IMAGE: ${{ steps.pin.outputs.pin }}
        SMOKE: ${{ inputs.smoke-command }}
      run: |
        set -euo pipefail
        echo "smoke-testing $IMAGE"
        bash -c "$SMOKE"
